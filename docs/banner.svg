<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 220" width="880" height="220" role="img" aria-label="YTCache — offline YouTube, captured as it plays">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#14161c"/>
      <stop offset="55%" stop-color="#1d1f27"/>
      <stop offset="100%" stop-color="#2a1215"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff3b30"/>
      <stop offset="100%" stop-color="#ff7a45"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="880" height="220" rx="22" fill="url(#bg)"/>
  <circle cx="760" cy="34" r="120" fill="#ff3b30" opacity="0.10"/>
  <circle cx="96" cy="200" r="130" fill="#ff7a45" opacity="0.07"/>

  <!-- mark: rounded square with play triangle + cache dot -->
  <g transform="translate(56 58)">
    <rect x="0" y="0" width="104" height="104" rx="30" fill="url(#accent)" filter="url(#glow)"/>
    <path d="M41 33 L75 52 L41 71 Z" fill="#ffffff"/>
    <circle cx="86" cy="18" r="9" fill="#14161c" stroke="#ffffff" stroke-width="3"/>
  </g>

  <text x="188" y="112" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="52" font-weight="700" fill="#ffffff" letter-spacing="-1">YTCache</text>
  <text x="190" y="146" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="17" fill="#c8ccd6" letter-spacing="0.3">Cache YouTube as it plays. Watch it offline.</text>

  <g font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#e6e8ee">
    <rect x="190" y="166" width="82" height="26" rx="13" fill="#ffffff" opacity="0.10"/>
    <text x="205" y="183">MediaSource</text>
    <rect x="282" y="166" width="70" height="26" rx="13" fill="#ffffff" opacity="0.10"/>
    <text x="296" y="183">WebView</text>
    <rect x="362" y="166" width="62" height="26" rx="13" fill="#ffffff" opacity="0.10"/>
    <text x="376" y="183">Kotlin</text>
    <rect x="434" y="166" width="52" height="26" rx="13" fill="#ffffff" opacity="0.10"/>
    <text x="448" y="183">APK</text>
    <rect x="496" y="166" width="74" height="26" rx="13" fill="#ffffff" opacity="0.10"/>
    <text x="510" y="183">No root</text>
  </g>
</svg>
